[package]
name = "expad"
version = "0.2.0"
edition = "2024"

[lib]
name = "expad"
path = "src/lib.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"
test = false
doctest = false

[[bin]]
name = "detect_pin_mapping"
path = "src/bin/detect_pin_mapping.rs"
test = false
doctest = false

[[bin]]
name = "rainbow"
path = "src/bin/rainbow.rs"
test = false
doctest = false

[[bin]]
name = "potentiometer"
path = "src/bin/potentiometer.rs"
test = false
doctest = false

[[bin]]
name = "midi_loopback"
path = "src/bin/midi_loopback.rs"
test = false
doctest = false

[[bin]]
name = "web_interface"
path = "src/bin/web_interface.rs"
test = false
doctest = false
required-features = ["web"]

[features]
default = ["web"]
# Pico 2 W WiFi access point plus the web interface server. Building it runs `npm` in web/.
web = [
  "dep:cyw43",
  "dep:cyw43-pio",
  "dep:edge-dhcp",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "dep:embassy-net",
  "dep:embassy-sync",
  "dep:picoserve",
  "dep:serde",
  "dep:serde-json-core",
]

[dependencies]
embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
embassy-time = { version = "0.5.1" }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
] }

cortex-m = "0.7.8"
cortex-m-rt = "0.7.6"

defmt = "1.1.1"
defmt-rtt = "1.3.0"
num_enum = { version = "0.7.6", default-features = false }
smart-leds = "0.4"
embassy-usb = { version = "0.6.0", default-features = false, features = [
  "defmt",
] }
static_cell = "2.1.1"
usbd-midi = "0.5.1"

cyw43 = { version = "0.7.0", features = ["defmt"], optional = true }
cyw43-pio = { version = "0.10.0", features = ["defmt"], optional = true }
edge-dhcp = { version = "0.8.0", features = ["defmt"], optional = true }
edge-nal = { version = "0.7.0", optional = true }
edge-nal-embassy = { version = "0.9.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "proto-ipv4",
  "udp",
], optional = true }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "medium-ethernet",
  "proto-ipv4",
  "tcp",
  "udp",
], optional = true }
embassy-sync = { version = "0.8.0", features = ["defmt"], optional = true }
picoserve = { version = "0.20.0", features = [
  "defmt",
  "embassy",
  "json",
  "ws",
], optional = true }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
], optional = true }
serde-json-core = { version = "0.6.0", features = ["defmt"], optional = true }

[build-dependencies]
dotenvy = "0.15.7"
