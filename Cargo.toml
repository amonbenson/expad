[package]
name = "expad"
version = "0.2.0"
edition = "2024"

[lib]
name = "expad"
path = "src/lib.rs"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"
test = false
doctest = false

[[bin]]
name = "detect_pin_mapping"
path = "src/bin/detect_pin_mapping.rs"
test = false
doctest = false

[[bin]]
name = "rainbow"
path = "src/bin/rainbow.rs"
test = false
doctest = false

[dependencies]
embassy-executor = { version = "0.9", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
panic-probe = { version = "1.0", features = ["print-defmt"] }
embassy-time = { version = "0.5.0" }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.9.0", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
] }

cortex-m = "0.7.8"
cortex-m-rt = "0.7.6"

defmt = "1.1.1"
defmt-rtt = "1.3.0"
num_enum = { version = "0.7.6", default-features = false }
smart-leds = "0.4"
